spring.application.name=memory-demo
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
demo.memory.enabled=${DEMO_MEMORY_ENABLED:true}
demo.memory.limit-mib=${DEMO_MEMORY_LIMIT_MIB:256}
demo.memory.interval-ms=${DEMO_MEMORY_INTERVAL_MS:1000}
